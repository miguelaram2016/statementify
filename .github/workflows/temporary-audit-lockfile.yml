name: Refresh audited lockfile (temporary)

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/production-audit-guard-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Check production audit
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-summary.cjs "$RUNNER_TEMP/audit.json"
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock audited source-map-js security patch"
            git push origin HEAD:refs/heads/chore/production-audit-guard-20261030
          fi
