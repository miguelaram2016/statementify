name: Statementify checks

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/statementify-audit.json" || true
          node scripts/audit-summary.cjs "$RUNNER_TEMP/statementify-audit.json"
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
