name: Refresh modernization lockfile (temporary)

on:
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/next16-security-modernization-20261030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Resolve and lock exact package versions without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified lockfile back to this trusted branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock verified Next 16 dependency tree"
            git push origin HEAD:refs/heads/chore/next16-security-modernization-20261030
          fi
